{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PL Softtech-Aptitude</title>
    <style>
        body{
            background-color:goldenrod;
        }
        .logo1{
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo1 img{
            margin-right: 10px;
        }
        .logo1 h1{
            font-size: 3.2rem;
        }
        .logo img{
            width: 700px;
            object-fit: contain;
            height: 550px;
            padding-left: 0;
        }
        .login{
            display: flex;
            gap: 120px;
            justify-content: center;
            align-items: center;
        }
        .box{
            margin: 40px 50px;
            padding: 30px;
            width: 300px;
            height: 400px;
            border-radius: 20px;
            /* text-align: center; */
            background-color: rgb(252, 250, 246);
            color: rgb(70, 70, 104);
        }
        input{
            width: 300px;
            height: 40px;
            border-radius: 10px;
            font-size: 16px;
            border: none;
            background-color:goldenrod;
        }
        label{
            font-size: 20px;
        }
        strong{
            font-size: 20px;
        }
        option,select{
            font-size: 16px;
        }
        h4,a{
            font-size: 20px;
        }
        a{
            text-decoration: none;
        }
        h4,h2{
            text-align: center;
        }
        .btn{
            text-align: center;
        }
        button{
            height: 40px;
            width: 100px;
            font-size: 20px;
            background-color: goldenrod;
            border-radius: 10px;
            color: white;
        }
        .eye{
            position: absolute;
            right: 10px;
            top: 10px;
            cursor: pointer;
        }
        @media (max-width: 768px){
            .box{
                margin-top: 80px;
                width: 90%;
                height: auto;
                margin-right: 0;
                margin-left: 0;
            }
            input{
                width: 100%;
            }
            .logo{
                display: none;
            }
            .logo img{
                width: 20px;
            }
            .logo1 h1{
                font-size: 2rem;
            }
        }
        @media (min-width: 768px) and (max-width: 1000px){
            .box{
                margin-top: 80px;
                width: 40%;
                height: 100%;
            }
            input{
                width: 100%;
            }
            .logo{
                display: none;
            }
            .logo img{
                width: 30px;
            }
            .logo1 h1{
                font-size: 2.7rem;
            }
        }
       @media (max-width: 1024px){
        .login{
            display: flex;
            gap: 0px;
        }
       }
    </style>
    <link rel="stylesheet" href="{% static 'quiz.css' %}">
</head>
<body>
    <div class="logo1">
        <img src="{% static 'images/logo.png' %}" style="height: 60px;" alt="">
        <h1>PL Soft tech</h1>
    </div>
    <div class="login">
        <div class="logo">
        <img src="{% static 'images/img1.png' %}" alt=""><br>
    </div>
        <div class="box">
        <form action="" id="login">
            <h2 style="color: goldenrod;">Login</h2>
            {% csrf_token %}
        <label for="">Email:</label><br><br><input type="text" name="" id="email"><br><br>
        <label for="">Password:</label><br><br>
        <div class="col" style="position: relative;">
            <input type="password" name="" id="password">
        <span class="eye" onclick="toggle()"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye" viewBox="0 0 16 16">
  <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"/>
  <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>
</svg></span></div><br><br>
        <div class="btn">
            <button type="submit">Login</button>
        </div>
        </form>
    </div>
    </div>
    <script>
        function toggle(){
            const pass=document.getElementById("password")
            if(pass.type=="password"){
                pass.type="text"
            }
            else{
                pass.type="password"
            }
        }
        const form = document.getElementById("login")
        form.addEventListener("submit", async function(event) {
        let csrftoken =document.querySelector('[name=csrfmiddlewaretoken]').value
        event.preventDefault()
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
    try {
        const response = await fetch(
            "/login/",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": csrftoken
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            }
        );
        const data = await response.json();
        if (response.ok) {
            localStorage.setItem("userid", data.userid);
            localStorage.setItem("name", data.name);
            localStorage.setItem("role", data.role);
            if (data.role === "Teacher") {
                window.location.href = "/teacher_page/";
            } else if (data.role === "Student") {
                window.location.href = "/student_page/";
            } 
        } else {
            alert(data.error || "Invalid email or password");
        }
    } catch (error) {
        console.log(error);
        alert("Unable to connect to server");
    }

});
    </script>
</body>
</html>
